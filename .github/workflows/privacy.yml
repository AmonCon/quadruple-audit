name: privacy

# 这是个公开仓库：真实项目名、本机路径、作者邮箱一旦提交就等于公开，
# 而它们不会让任何测试失败。所以单独一道门。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须拉全历史：提交身份和提交信息都要逐条查，
          # 默认的浅克隆只有一个提交，历史里的问题会被漏掉。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-privacy.mjs
